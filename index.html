<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCR To Let Services - Buy, Sell & Rent Properties</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(rgba(244, 247, 246, 0.92), rgba(244, 247, 246, 0.92)), 
                        url('https://images.unsplash.com/photo-1560518883-ce09059eeffa?auto=format&fit=crop&w=1200&q=80') center/cover fixed no-repeat;
            color: #333;
            padding-bottom: 80px;
        }

        header {
            background: linear-gradient(135deg, #0056b3, #007bff);
            color: white;
            text-align: center;
            padding: 35px 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        header h1 {
            font-size: 2.2rem;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .container {
            max-width: 1100px;
            margin: 25px auto;
            padding: 0 15px;
        }

        /* Add Property Top Bar */
        .top-action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .add-prop-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(40, 167, 69, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }
        .add-prop-btn:hover {
            background-color: #218838;
            transform: translateY(-2px);
        }

        /* Property Grid */
        .property-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            transition: 0.3s;
            position: relative;
        }
        .badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: #ff9800;
            color: white;
            padding: 4px 12px;
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: 20px;
            text-transform: uppercase;
        }
        .badge.sale { background: #e91e63; }
        .badge.rent { background: #2196f3; }

        .card-media {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #eee;
        }
        .card-content {
            padding: 18px;
        }
        .card-title {
            font-size: 1.2rem;
            margin-bottom: 6px;
            color: #222;
        }
        .price {
            font-weight: 700;
            color: #28a745;
            font-size: 1.2rem;
            margin-bottom: 8px;
        }
        .details {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 15px;
        }

        /* Buttons */
        .btn-group {
            display: flex;
            gap: 10px;
        }
        .btn {
            flex: 1;
            padding: 10px;
            text-align: center;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-call { background-color: #007bff; color: white; }
        .btn-wa { background-color: #25d366; color: white; }

        /* Modal / Form Styling */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            position: relative;
        }
        .close-btn {
            position: absolute;
            top: 15px; right: 20px;
            font-size: 24px;
            cursor: pointer;
            color: #888;
        }
        .modal-content h3 {
            margin-bottom: 15px;
            color: #007bff;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 4px;
            font-weight: 600;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
        }
        .submit-btn {
            width: 100%;
            background: #007bff;
            color: white;
            border: none;
            padding: 10px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Floating WhatsApp Button */
        .whatsapp-float {
            position: fixed;
            bottom: 20px; right: 20px;
            background-color: #25d366;
            color: white;
            width: 60px; height: 60px;
            border-radius: 50px;
            text-align: center;
            font-size: 32px;
            box-shadow: 2px 4px 12px rgba(0,0,0,0.3);
            z-index: 1000;
            display: flex;
            align-items: center; justify-content: center;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>NCR To Let Services</h1>
        <p>Buy, Sell & Rent Properties in Noida & NCR Region</p>
    </header>

    <div class="container">
        
        <div class="top-action-bar">
            <h2>Available Properties</h2>
            <button class="add-prop-btn" onclick="openModal()">
                <i class="fa-solid fa-plus"></i> Add Property
            </button>
        </div>

        <!-- Property Grid -->
        <div class="property-grid" id="propertyGrid">
            
            <!-- Default Property 1 -->
            <div class="card">
                <span class="badge rent">For Rent</span>
                <img class="card-media" src="https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?auto=format&fit=crop&w=600&q=80" alt="2 BHK Flat">
                <div class="card-content">
                    <h3 class="card-title">2 BHK Furnished Apartment</h3>
                    <p class="price">₹22,000 / Month</p>
                    <p class="details"><i class="fa-solid fa-location-dot"></i> Sector 62, Noida</p>
                    <div class="btn-group">
                        <a href="tel:+919253174766" class="btn btn-call"><i class="fa-solid fa-phone"></i> Call</a>
                        <a href="https://wa.me/919253174766" target="_blank" class="btn btn-wa"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Modal Form for Adding Property -->
    <div class="modal" id="propertyModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h3>Add New Property</h3>
            <form id="addPropertyForm">
                <div class="form-group">
                    <label>Property Title</label>
                    <input type="text" id="propTitle" placeholder="e.g. 3 BHK Luxury Flat" required>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="propCategory">
                        <option value="For Rent">For Rent</option>
                        <option value="For Sale">For Sale</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Price</label>
                    <input type="text" id="propPrice" placeholder="e.g. ₹25,000 / Month or ₹50 Lakhs" required>
                </div>
                <div class="form-group">
                    <label>Location</label>
                    <input type="text" id="propLocation" placeholder="e.g. Sector 18, Noida" required>
                </div>
                <div class="form-group">
                    <label>Image URL (Optional)</label>
                    <input type="url" id="propImg" placeholder="https://example.com/photo.jpg">
                </div>
                <button type="submit" class="submit-btn">Save Property</button>
            </form>
        </div>
    </div>

    <!-- Floating WhatsApp Button -->
    <a href="https://wa.me/919253174766" class="whatsapp-float" target="_blank">
        <i class="fa-brands fa-whatsapp"></i>
    </a>

    <!-- JavaScript to Handle Dynamic Addition -->
    <script>
        function openModal() {
            document.getElementById('propertyModal').style.display = 'flex';
        }
        function closeModal() {
            document.getElementById('propertyModal').style.display = 'none';
        }

        document.getElementById('addPropertyForm').addEventListener('submit', function(e) {
            e.preventDefault();

            var title = document.getElementById('propTitle').value;
            var category = document.getElementById('propCategory').value;
            var price = document.getElementById('propPrice').value;
            var location = document.getElementById('propLocation').value;
            var imgUrl = document.getElementById('propImg').value || 'https://images.unsplash.com/photo-1560518883-ce09059eeffa?auto=format&fit=crop&w=600&q=80';
            var badgeClass = category === 'For Sale' ? 'sale' : 'rent';

            var cardHTML = `
                <div class="card">
                    <span class="badge ${badgeClass}">${category}</span>
                    <img class="card-media" src="${imgUrl}" alt="${title}">
                    <div class="card-content">
                        <h3 class="card-title">${title}</h3>
                        <p class="price">${price}</p>
                        <p class="details"><i class="fa-solid fa-location-dot"></i> ${location}</p>
                        <div class="btn-group">
                            <a href="tel:+919253174766" class="btn btn-call"><i class="fa-solid fa-phone"></i> Call</a>
                            <a href="https://wa.me/919253174766" target="_blank" class="btn btn-wa"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('propertyGrid').insertAdjacentHTML('afterbegin', cardHTML);
            closeModal();
            this.reset();
        });
    </script>
</body>
</html>
