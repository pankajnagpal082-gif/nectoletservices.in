<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCR Properties | Buy, Sell & Rent Properties in Delhi NCR</title>
    
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary: #0f172a;
            --accent: #f59e0b;
            --success: #10b981;
            --danger: #ef4444;
            --bg-light: #f8fafc;
            --card-border: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-light); color: #334155; padding-bottom: 60px; }

        /* NAVBAR */
        nav {
            background: #ffffff;
            padding: 16px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo { font-size: 1.6rem; font-weight: 800; color: var(--secondary); text-decoration: none; display: flex; align-items: center; gap: 8px; }
        .logo span { color: var(--primary); }
        .nav-actions { display: flex; gap: 12px; align-items: center; }
        
        .nav-contact {
            background: #eff6ff; color: var(--primary); padding: 10px 18px; border-radius: 30px; font-weight: 700; font-size: 0.95rem; text-decoration: none; display: flex; align-items: center; gap: 8px; border: 1px solid #bfdbfe; transition: all 0.3s;
        }
        .nav-contact:hover { background: var(--primary); color: white; }

        .btn-admin-toggle {
            background: var(--secondary); color: white; border: none; padding: 10px 16px; border-radius: 30px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 0.9rem;
        }

        /* HERO & BACKGROUND */
        .hero-section {
            background: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.9)), 
                        url('https://images.unsplash.com/photo-1582407947304-fd86f028f716?auto=format&fit=crop&w=1600&q=80') center/cover;
            padding: 70px 20px 90px; text-align: center; color: white;
        }
        .hero-title { font-size: 2.5rem; font-weight: 800; margin-bottom: 12px; }
        .hero-subtitle { color: #cbd5e1; font-size: 1.1rem; margin-bottom: 30px; }

        /* ADVANCED FILTER CARD */
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .filter-card {
            background: #ffffff; border-radius: 16px; padding: 24px; margin-top: -40px; margin-bottom: 40px; box-shadow: 0 20px 40px rgba(0,0,0,0.08); border: 1px solid var(--card-border);
        }
        .filter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .filter-group label { display: block; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; color: #64748b; margin-bottom: 6px; }
        .filter-group select, .filter-group input {
            width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; font-size: 0.95rem; background: #f8fafc;
        }

        /* PROPERTY GRID */
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .property-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 30px; }

        /* PROPERTY CARD */
        .card { background: #ffffff; border-radius: 16px; overflow: hidden; border: 1px solid var(--card-border); transition: all 0.3s ease; display: flex; flex-direction: column; position: relative; }
        .card:hover { transform: translateY(-6px); box-shadow: 0 15px 30px rgba(0,0,0,0.1); }
        .card-media { position: relative; height: 220px; }
        .card-media img { width: 100%; height: 100%; object-fit: cover; }

        .badge { position: absolute; top: 15px; padding: 6px 12px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: white; z-index: 5; }
        .badge-type { left: 15px; background: var(--secondary); }
        .badge-status { right: 15px; }
        .status-sale { background: var(--primary); }
        .status-rent { background: #8b5cf6; }
        .status-sold { background: var(--danger); }

        .city-tag { position: absolute; bottom: 12px; left: 15px; background: rgba(0,0,0,0.75); color: white; padding: 4px 10px; border-radius: 4px; font-size: 0.8rem; }

        .card-body { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; }
        .price { font-size: 1.4rem; font-weight: 800; color: var(--primary); margin-bottom: 6px; }
        .card-title { font-size: 1.15rem; font-weight: 700; color: var(--secondary); margin-bottom: 6px; }
        .location { font-size: 0.88rem; color: #64748b; margin-bottom: 16px; display: flex; align-items: center; gap: 6px; }

        .specs-grid { display: grid; grid-template-columns: repeat(3, 1fr); background: #f8fafc; padding: 10px; border-radius: 8px; margin-bottom: 20px; text-align: center; border: 1px solid #f1f5f9; }
        .spec-item { font-size: 0.8rem; color: #64748b; }
        .spec-item strong { display: block; color: var(--secondary); font-size: 0.9rem; }

        .btn-group { margin-top: auto; display: flex; gap: 10px; }
        .btn { flex: 1; padding: 10px; border-radius: 8px; font-size: 0.88rem; font-weight: 600; text-align: center; text-decoration: none; cursor: pointer; border: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-call { background: #eff6ff; color: var(--primary); border: 1px solid #bfdbfe; }
        .btn-call:hover { background: var(--primary); color: white; }
        .btn-wa { background: #25d366; color: white; }
        .btn-wa:hover { background: #1da851; }

        /* ADMIN EDIT CONTROLS */
        .admin-controls { display: none; gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 1px dashed #cbd5e1; }
        .btn-edit { background: var(--accent); color: white; }
        .btn-delete { background: var(--danger); color: white; }

        /* FLOATING WHATSAPP */
        .wa-float { position: fixed; bottom: 25px; right: 25px; background: #25d366; color: white; width: 58px; height: 58px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4); z-index: 99; text-decoration: none; }

        /* MODAL POPUP (FOR ADD/EDIT) */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: white; padding: 25px; border-radius: 16px; width: 100%; max-width: 550px; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .close-btn { font-size: 1.5rem; cursor: pointer; border: none; background: none; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .form-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
        .form-group.full { grid-column: span 2; }
        .form-group label { font-size: 0.85rem; font-weight: 600; }
        .form-group input, .form-group select { padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; }
        .btn-save { background: var(--primary); color: white; padding: 12px; border-radius: 8px; font-weight: 700; border: none; cursor: pointer; width: 100%; margin-top: 10px; }

        @media (max-width: 768px) {
            .hero-title { font-size: 1.8rem; }
            .nav-contact span { display: none; }
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav>
        <a href="#" class="logo"><i class="fa-solid fa-building-user"></i> NCR <span>Properties</span></a>
        <div class="nav-actions">
            <!-- Direct Visible Phone Number -->
            <a href="tel:+919253174766" class="nav-contact">
                <i class="fa-solid fa-phone"></i> <span>+91 9253174766</span>
            </a>
            <!-- Admin Toggle Button -->
            <button class="btn-admin-toggle" onclick="toggleAdminMode()">
             <!-- <i class="fa-solid fa-lock" id="adminIcon"></i> <span id="adminText">Admin Login</span>
            </button>-->
        </div>
    </nav>

    <!-- HERO SECTION -->
    <div class="hero-section">
        <h1 class="hero-title">Find Properties in Delhi NCR</h1>
        <p class="hero-subtitle">Buy, Sell & Rent Verified Properties in Noida, Ghaziabad, Gurgaon & Delhi</p>
    </div>

    <!-- FILTER SECTION -->
    <div class="container">
        <div class="filter-card">
            <div class="filter-grid">
                <div class="filter-group">
                    <label>City / Location</label>
                    <select id="filterCity" onchange="applyFilters()">
                        <option value="all">All Locations</option>
                        <option value="noida">Noida</option>
                        <option value="greater-noida">Greater Noida</option>
                        <option value="ghaziabad">Ghaziabad</option>
                        <option value="gurgaon">Gurgaon</option>
                        <option value="delhi">Delhi</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Purpose</label>
                    <select id="filterPurpose" onchange="applyFilters()">
                        <option value="all">All Purpose (Buy/Rent)</option>
                        <option value="sale">For Sale</option>
                        <option value="rent">For Rent</option>
                        <option value="sold">Sold Out</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Bedrooms (BHK)</label>
                    <select id="filterBhk" onchange="applyFilters()">
                        <option value="all">Any BHK</option>
                        <option value="1bhk">1 BHK / Studio</option>
                        <option value="2bhk">2 BHK</option>
                        <option value="3bhk">3 BHK</option>
                        <option value="4bhk">4+ BHK / Villa</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Search Sector / Title</label>
                    <input type="text" id="filterKeyword" onkeyup="applyFilters()" placeholder="e.g. Sector 62, Indirapuram...">
                </div>
            </div>
        </div>

        <!-- LISTINGS HEADER -->
        <div class="section-header">
            <h2>Available Properties</h2>
            <button id="addPropertyBtn" class="btn btn-call" style="display:none; width: auto; padding: 10px 20px;" onclick="openAddModal()">
                <i class="fa-solid fa-plus"></i> Add New Property
            </button>
        </div>

        <!-- PROPERTY GRID CONTAINER -->
        <div class="property-grid" id="propertyGrid"></div>
    </div>

    <!-- FLOATING WHATSAPP BUTTON -->
    <a href="https://wa.me/919253174766?text=Hi,%20I%20am%20looking%20for%20a%20property%20in%20NCR" class="wa-float" target="_blank">
        <i class="fa-brands fa-whatsapp"></i>
    </a>

    <!-- ADD / EDIT PROPERTY MODAL FORM -->
    <div class="modal" id="propertyModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Add New Property</h3>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <form id="propertyForm" onsubmit="saveProperty(event)">
                <input type="hidden" id="propId">
                
                <div class="form-group full">
                    <label>Property Title</label>
                    <input type="text" id="propTitle" placeholder="e.g. 2 BHK Luxury Flat" required>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label>Price</label>
                        <input type="text" id="propPrice" placeholder="e.g. ₹55.0 Lakhs or ₹20,000/mo" required>
                    </div>
                    <div class="form-group">
                        <label>Purpose</label>
                        <select id="propPurpose">
                            <option value="sale">For Sale</option>
                            <option value="rent">For Rent</option>
                            <option value="sold">Sold Out</option>
                        </select>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label>City / Region</label>
                        <select id="propCity">
                            <option value="noida">Noida</option>
                            <option value="greater-noida">Greater Noida</option>
                            <option value="ghaziabad">Ghaziabad</option>
                            <option value="gurgaon">Gurgaon</option>
                            <option value="delhi">Delhi</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>BHK / Type</label>
                        <select id="propBhk">
                            <option value="1bhk">1 BHK</option>
                            <option value="2bhk">2 BHK</option>
                            <option value="3bhk">3 BHK</option>
                            <option value="4bhk">4+ BHK / Villa</option>
                        </select>
                    </div>
                </div>

                <div class="form-group full">
                    <label>Location / Address</label>
                    <input type="text" id="propLocation" placeholder="e.g. Sector 62, Near Metro Station" required>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label>Area (Sq Ft)</label>
                        <input type="text" id="propArea" placeholder="e.g. 1050">
                    </div>
                    <div class="form-group">
                        <label>Floor</label>
                        <input type="text" id="propFloor" placeholder="e.g. 4th Floor">
                    </div>
                </div>

                <div class="form-group full">
                    <label>Photo URL (Image Link)</label>
                    <input type="url" id="propImage" placeholder="Paste Image Link Here" required>
                </div>

                <button type="submit" class="btn-save">Save Property</button>
            </form>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        const MY_NUMBER = "9253174766";
        let isAdmin = false;

        // Default Sample Properties Data
        const defaultProperties = [
            {
                id: "1",
                title: "2 BHK Semi-Furnished Flat",
                price: "₹55.0 Lakhs",
                purpose: "sale",
                city: "noida",
                bhk: "2bhk",
                location: "Sector 62, Noida",
                area: "1050",
                floor: "4th Floor",
                image: "https://images.unsplash.com/photo-1560448204-e02f11c3d0e2?auto=format&fit=crop&w=600&q=80"
            },
            {
                id: "2",
                title: "3 BHK Highrise Flat",
                price: "₹25,000 / Month",
                purpose: "rent",
                city: "ghaziabad",
                bhk: "3bhk",
                location: "Indirapuram, Ghaziabad",
                area: "1450",
                floor: "8th Floor",
                image: "https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=600&q=80"
            }
        ];

        // Load Properties from LocalStorage or use Default
        function getProperties() {
            const stored = localStorage.getItem('ncr_properties');
            return stored ? JSON.parse(stored) : defaultProperties;
        }

        function savePropertiesToStorage(data) {
            localStorage.setItem('ncr_properties', JSON.stringify(data));
            renderProperties();
        }

        // Render Property Cards
        function renderProperties() {
            const properties = getProperties();
            const grid = document.getElementById('propertyGrid');
            grid.innerHTML = '';

            properties.forEach(prop => {
                const statusClass = prop.purpose === 'sale' ? 'status-sale' : (prop.purpose === 'rent' ? 'status-rent' : 'status-sold');
                const statusLabel = prop.purpose === 'sale' ? 'For Sale' : (prop.purpose === 'rent' ? 'For Rent' : 'SOLD OUT');

                const cardHtml = `
                    <div class="card property-item" data-city="${prop.city}" data-purpose="${prop.purpose}" data-bhk="${prop.bhk}" data-search="${prop.title} ${prop.location}">
                        <div class="card-media">
                            <span class="badge badge-type">${prop.bhk.toUpperCase()}</span>
                            <span class="badge badge-status ${statusClass}">${statusLabel}</span>
                            <img src="${prop.image}" alt="${prop.title}">
                            <span class="city-tag"><i class="fa-solid fa-location-dot"></i> ${prop.location}</span>
                        </div>
                        <div class="card-body">
                            <p class="price">${prop.price}</p>
                            <h3 class="card-title">${prop.title}</h3>
                            <p class="location"><i class="fa-solid fa-map-pin"></i> ${prop.location}</p>
                            <div class="specs-grid">
                                <div class="spec-item"><strong>${prop.bhk.toUpperCase()}</strong>Type</div>
                                <div class="spec-item"><strong>${prop.area || 'N/A'}</strong>Sq.Ft.</div>
                                <div class="spec-item"><strong>${prop.floor || 'N/A'}</strong>Floor</div>
                            </div>
                            <div class="btn-group">
                                <a href="tel:+91${MY_NUMBER}" class="btn btn-call"><i class="fa-solid fa-phone"></i> Call (${MY_NUMBER})</a>
                                <a href="https://wa.me/91${MY_NUMBER}?text=Hi,%20I%20am%20interested%20in%20${encodeURIComponent(prop.title)}" target="_blank" class="btn btn-wa"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>
                            </div>
                            <div class="admin-controls" style="display: ${isAdmin ? 'flex' : 'none'}">
                                <button class="btn btn-edit" onclick="openEditModal('${prop.id}')"><i class="fa-solid fa-pen"></i> Edit</button>
                                <button class="btn btn-delete" onclick="deleteProperty('${prop.id}')"><i class="fa-solid fa-trash"></i> Delete</button>
                            </div>
                        </div>
                    </div>
                `;
                grid.innerHTML += cardHtml;
            });
            applyFilters();
        }

        // Admin Toggle Mode
        function toggleAdminMode() {
            if (!isAdmin) {
                const pass = prompt("Enter Admin Password:");
                if (pass === "1234") { // Default Admin Password
                    isAdmin = true;
                    document.getElementById('adminText').innerText = "Admin Active";
                    document.getElementById('adminIcon').className = "fa-solid fa-unlock";
                    document.getElementById('addPropertyBtn').style.display = "inline-flex";
                    alert("Admin Mode Activated! You can now Add, Edit, or Delete properties.");
                } else {
                    alert("Incorrect Password!");
                }
            } else {
                isAdmin = false;
                document.getElementById('adminText').innerText = "Admin Login";
                document.getElementById('adminIcon').className = "fa-solid fa-lock";
                document.getElementById('addPropertyBtn').style.display = "none";
            }
            renderProperties();
        }

        // Modal Controls
        function openAddModal() {
            document.getElementById('propertyForm').reset();
            document.getElementById('propId').value = '';
            document.getElementById('modalTitle').innerText = "Add New Property";
            document.getElementById('propertyModal').style.display = 'flex';
        }

        function openEditModal(id) {
            const properties = getProperties();
            const prop = properties.find(p => p.id === id);
            if (!prop) return;

            document.getElementById('propId').value = prop.id;
            document.getElementById('propTitle').value = prop.title;
            document.getElementById('propPrice').value = prop.price;
            document.getElementById('propPurpose').value = prop.purpose;
            document.getElementById('propCity').value = prop.city;
            document.getElementById('propBhk').value = prop.bhk;
            document.getElementById('propLocation').value = prop.location;
            document.getElementById('propArea').value = prop.area;
            document.getElementById('propFloor').value = prop.floor;
            document.getElementById('propImage').value = prop.image;

            document.getElementById('modalTitle').innerText = "Edit Property";
            document.getElementById('propertyModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('propertyModal').style.display = 'none';
        }

        // Save Property (Add/Edit)
        function saveProperty(e) {
            e.preventDefault();
            let properties = getProperties();
            const id = document.getElementById('propId').value;

            const newProp = {
                id: id ? id : Date.now().toString(),
                title: document.getElementById('propTitle').value,
                price: document.getElementById('propPrice').value,
                purpose: document.getElementById('propPurpose').value,
                city: document.getElementById('propCity').value,
                bhk: document.getElementById('propBhk').value,
                location: document.getElementById('propLocation').value,
                area: document.getElementById('propArea').value,
                floor: document.getElementById('propFloor').value,
                image: document.getElementById('propImage').value
            };

            if (id) {
                properties = properties.map(p => p.id === id ? newProp : p);
            } else {
                properties.push(newProp);
            }

            savePropertiesToStorage(properties);
            closeModal();
        }

        // Delete Property
        function deleteProperty(id) {
            if (confirm("Are you sure you want to delete this property?")) {
                let properties = getProperties();
                properties = properties.filter(p => p.id !== id);
                savePropertiesToStorage(properties);
            }
        }

        // Live Filters
        function applyFilters() {
            const city = document.getElementById('filterCity').value;
            const purpose = document.getElementById('filterPurpose').value;
            const bhk = document.getElementById('filterBhk').value;
            const keyword = document.getElementById('filterKeyword').value.toLowerCase();

            document.querySelectorAll('.property-item').forEach(item => {
                const matchCity = (city === 'all' || item.dataset.city === city);
                const matchPurpose = (purpose === 'all' || item.dataset.purpose === purpose);
                const matchBhk = (bhk === 'all' || item.dataset.bhk === bhk);
                const matchKeyword = (keyword === '' || item.dataset.search.toLowerCase().includes(keyword));

                if (matchCity && matchPurpose && matchBhk && matchKeyword) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            });
        }

        // Initial Load
        renderProperties();
    </script>
</body>
</html>
